<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AlameeereTv - HLS & DASH ClearKey</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- مكتبة HLS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.8/hls.min.js"></script>
    <!-- مكتبة Shaka Player لدعم MPEG-DASH مع تشفير ClearKey -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.12.3/shaka-player.compiled.js"></script>
</head>
<body>
    <div id="app">
        <div id="player-wrap">
            <video id="vid" playsinline></video>
            <div id="brightness-layer"></div>
            <div id="brand-overlay"><span>ALAMEEERE TV</span></div>

            <div id="loader">
                <div class="spin"></div>
                <div class="loader-txt">جارٍ التحميل...</div>
            </div>

            <div id="err-toast"></div>

            <div id="controls-overlay">
                <div id="top-bar">
                    <span id="ch-title"></span>
                    <div id="speed-badge" class="hide">📡 ...</div>
                </div>

                <div id="bottom-bar">
                    <div id="btn-row">
                        <button class="ib" onclick="togglePlay()" title="تشغيل / إيقاف">⏯</button>
                        <button class="ib" onclick="skip(-10)" title="تراجع 10 ثوان">⏪</button>
                        <button class="ib" onclick="skip(10)" title="تقديم 10 ثوان">⏩</button>
                        <button class="ib" id="mute-btn" onclick="toggleMute()" title="كتم الصوت">🔊</button>
                        <input type="range" id="vs" min="0" max="1" step="0.05" value="1" oninput="setVolume(this.value)">
                        <div style="flex:1"></div>
                        <button class="tb" id="spd-btn" onclick="toggleSpeed()" title="عداد السرعة">سرعة</button>
                        <button class="tb" id="fit-btn" onclick="cycleAspect()" title="تناسب العرض">↕ عادي</button>
                        <button class="tb" onclick="reloadCurrentStream()" title="تحديث البث">🔄</button>
                        <div id="qw">
                            <button class="tb" id="q-btn" onclick="toggleQ()" title="الجودة">جودة</button>
                            <div id="qm"></div>
                        </div>
                        <button class="ib" onclick="doFullscreen()" title="شاشة كاملة">⛶</button>
                    </div>
                </div>
            </div>

            <div id="iframe-wrap"><iframe id="iframe-player" allowfullscreen></iframe></div>
            <div id="dbl-hint"><span id="dbl-txt"></span></div>

            <div id="swipe-ind">
                <span id="si-icon"></span>
                <span id="si-label"></span>
                <div id="si-bar-wrap"><div id="si-bar"></div></div>
            </div>
        </div>

        <div id="ch-rows"></div>
    </div>

    <script src="channels.js"></script>
    <script src="player.js"></script>
</body>
</html>
