<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlameeereMovies | أحدث الأفلام والمسلسلات مجاناً</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f0f15; color: #fff; padding: 20px; }
        
        header { text-align: center; margin-bottom: 30px; }
        header h1 { color: #e50914; font-size: 2.2rem; margin-bottom: 10px; font-weight: 800; }
        header p { color: #aaa; font-size: 0.95rem; }
        
        .search-container { max-width: 600px; margin: 0 auto 30px auto; display: flex; gap: 10px; }
        .search-container input { flex: 1; padding: 14px 20px; border: 1px solid #2a2a40; background: #1f1f2e; color: white; border-radius: 30px; font-size: 15px; outline: none; transition: border-color 0.3s; }
        .search-container input:focus { border-color: #e50914; }
        .search-container button { padding: 0 28px; background: #e50914; border: none; color: white; border-radius: 30px; font-weight: bold; font-size: 15px; cursor: pointer; transition: background 0.2s; }
        .search-container button:hover { background: #b80710; }

        .player-container { max-width: 900px; margin: 0 auto 40px auto; display: none; background: #14141f; border: 1px solid #2a2a40; border-radius: 12px; overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.7); }
        .player-container iframe { width: 100%; aspect-ratio: 16/9; border: 0; display: block; }
        .close-btn { background: #e50914; color: white; border: none; padding: 14px; cursor: pointer; width: 100%; font-weight: bold; font-size: 15px; transition: background 0.2s; }
        .close-btn:hover { background: #b80710; }
        
        .player-bar { padding: 12px 16px; background: #1f1f2e; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; border-top: 1px solid #2a2a40; }
        .server-btns { display: flex; gap: 8px; align-items: center; }
        .server-btns span { font-size: 13px; color: #aaa; }
        .server-btns button { padding: 6px 14px; border-radius: 6px; border: 1px solid #3a3a55; background: #14141f; color: #fff; font-size: 13px; cursor: pointer; font-weight: bold; }
        .server-btns button.active { background: #e50914; border-color: #e50914; }
        
        .episode-controls { display: none; gap: 14px; align-items: center; }
        .episode-controls label { font-weight: bold; font-size: 13px; color: #ddd; }
        .episode-controls input { width: 65px; padding: 6px 10px; background: #0f0f15; border: 1px solid #444; color: white; border-radius: 6px; text-align: center; font-size: 14px; outline: none; }
        .episode-controls input:focus { border-color: #e50914; }

        .section-title { margin-bottom: 25px; font-size: 1.5rem; border-right: 5px solid #e50914; padding-right: 12px; font-weight: 700; }
        .movies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
        .movie-card { background: #1f1f2e; border-radius: 10px; overflow: hidden; cursor: pointer; transition: all 0.3s ease; position: relative; border: 1px solid #2a2a40; }
        .movie-card:hover { transform: translateY(-6px); border-color: #e50914; box-shadow: 0 10px 20px rgba(229, 9, 20, 0.25); }
        .movie-card img { width: 100%; height: 240px; object-fit: cover; display: block; background-color: #14141f; }
        .movie-info { padding: 12px; text-align: center; }
        .movie-title { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
        
        .badge { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.85); color: #ffbd03; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; z-index: 2; }
        .type-badge { position: absolute; top: 10px; left: 10px; background: #e50914; color: white; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; z-index: 2; }
    </style>
</head>
<body>

    <header>
        <h1>AlameeereMovies</h1>
        <p>شاهد أحدث الأفلام والمسلسلات العالمية مجاناً وبأعلى جودة</p>
    </header>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="ابحث عن فيلم أو مسلسل بالاسم هنا...">
        <button onclick="searchMedia()">بحث</button>
    </div>

    <div class="player-container" id="playerContainer">
        <button class="close-btn" onclick="closePlayer()">إغلاق شاشة العرض والعودة للمكتبة ✕</button>
        
        <!-- حظر النوافذ المنبثقة الإعلانية عبر sandbox مع السماح بالفيديو والصوت فقط -->
        <iframe id="mainIframe" src="" allowfullscreen allow="autoplay; fullscreen; picture-in-picture; encrypted-media"></iframe>
        
        <div class="player-bar">
            <div class="server-btns">
                <span>السيرفر:</span>
                <button id="srv1" class="active" onclick="switchServer('vidlink')">⚡ سيرفر 1 (سريع + ترجمة)</button>
                <button id="srv2" onclick="switchServer('autoembed')">🌐 سيرفر 2 (AutoEmbed)</button>
                <button id="srv3" onclick="switchServer('vidsrc')">🔄 سيرفر 3</button>
            </div>

            <div class="episode-controls" id="episodeControls">
                <div>
                    <label for="seasonInput">الموسم: </label>
                    <input type="number" id="seasonInput" value="1" min="1" onchange="updateEpisode()">
                </div>
                <div>
                    <label for="episodeInput">الحلقة: </label>
                    <input type="number" id="episodeInput" value="1" min="1" onchange="updateEpisode()">
                </div>
            </div>
        </div>
    </div>

    <h2 class="section-title" id="gridTitle">🔥 الأكثر رواجاً هذا الأسبوع:</h2>
    <div class="movies-grid" id="moviesGrid">
        <p id="loadingText" style="grid-column: 1/-1; text-align:center; color:#ffbd03;">جاري تحميل مكتبة الأفلام السريعة...</p>
    </div>

    <script>
        const TMDB_API_KEY = 'c7f20018c3cfc5d46cdc6f1defb13d3d'; 

        let currentMediaId = null;
        let currentMediaType = null;
        let currentServer = 'vidlink';

        const moviesGrid = document.getElementById('moviesGrid');
        const playerContainer = document.getElementById('playerContainer');
        const mainIframe = document.getElementById('mainIframe');
        const episodeControls = document.getElementById('episodeControls');
        const gridTitle = document.getElementById('gridTitle');
        const searchInput = document.getElementById('searchInput');
        const loadingText = document.getElementById('loadingText');

        async function fetchTrendingMedia() {
            try {
                const url = `https://api.themoviedb.org/3/trending/all/week?api_key=${TMDB_API_KEY}&language=ar`;
                const response = await fetch(url);
                const data = await response.json();
                
                if (loadingText) loadingText.style.display = 'none';
                displayMedia(data.results || []);
            } catch (error) {
                console.error("خطأ:", error);
                if (loadingText) loadingText.innerText = "فشل تحميل الأفلام. تأكد من اتصال الإنترنت.";
            }
        }

        async function searchMedia() {
            const query = searchInput.value.trim();
            if (!query) return;
            moviesGrid.innerHTML = "<p style='grid-column: 1/-1; text-align:center; color:#ffbd03;'>جاري البحث السريع...</p>";
            
            try {
                const url = `https://api.themoviedb.org/3/search/multi?api_key=${TMDB_API_KEY}&language=ar&query=${encodeURIComponent(query)}`;
                const response = await fetch(url);
                const data = await response.json();
                
                gridTitle.innerText = "🔍 نتائج البحث عن: " + query;
                displayMedia(data.results || []);
            } catch (error) {
                console.error("خطأ:", error);
            }
        }

        searchInput.addEventListener("keyup", function(event) {
            if (event.key === "Enter") { searchMedia(); }
        });

        function displayMedia(items) {
            moviesGrid.innerHTML = '';
            let validCardsCount = 0;
            
            items.forEach(item => {
                const title = item.title || item.name;
                const mediaType = item.media_type || (item.title ? 'movie' : 'tv');
                
                if (!item.poster_path || !title || mediaType === 'person') return;
                
                validCardsCount++;
                const card = document.createElement('div');
                card.className = 'movie-card';
                
                const typeLabel = mediaType === 'movie' ? 'فيلم' : 'مسلسل';
                const ratingValue = item.vote_average ? item.vote_average.toFixed(1) : '0.0';
                
                card.innerHTML = '<div class="badge">⭐ ' + ratingValue + '</div>' +
                                 '<div class="type-badge">' + typeLabel + '</div>' +
                                 '<img src="https://image.tmdb.org/t/p/w500' + item.poster_path + '" alt="' + title + '">' +
                                 '<div class="movie-info"><div class="movie-title">' + title + '</div></div>';

                card.onclick = function() { startPlay(item.id, mediaType); };
                moviesGrid.appendChild(card);
            });

            if (validCardsCount === 0) {
                moviesGrid.innerHTML = "<p style='grid-column: 1/-1; text-align:center; color: #aaa;'>لا توجد نتائج متوفرة.</p>";
            }
        }

        function startPlay(id, type) {
            currentMediaId = id;
            currentMediaType = type;
            
            document.getElementById('seasonInput').value = 1;
            document.getElementById('episodeInput').value = 1;

            if (type === 'tv') {
                episodeControls.style.display = 'flex';
            } else {
                episodeControls.style.display = 'none';
            }

            renderEmbed();
            playerContainer.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderEmbed() {
            if (!currentMediaId) return;
            const season = document.getElementById('seasonInput').value || 1;
            const episode = document.getElementById('episodeInput').value || 1;
            let finalUrl = '';

            if (currentServer === 'vidlink') {
                // سيرفر VidLink: سريع وفيه زر ترجمة متعددة (CC) وإعلانات أقل بكثير
                if (currentMediaType === 'movie') {
                    finalUrl = `https://vidlink.pro/movie/${currentMediaId}`;
                } else {
                    finalUrl = `https://vidlink.pro/tv/${currentMediaId}/${season}/${episode}`;
                }
            } else if (currentServer === 'autoembed') {
                // سيرفر AutoEmbed: بديل ممتاز وفيه زر ترجمة
                if (currentMediaType === 'movie') {
                    finalUrl = `https://player.autoembed.cc/embed/movie/${currentMediaId}`;
                } else {
                    finalUrl = `https://player.autoembed.cc/embed/tv/${currentMediaId}/${season}/${episode}`;
                }
            } else {
                // سيرفر vidsrc كخيار أخير
                if (currentMediaType === 'movie') {
                    finalUrl = `https://vidsrc.to/embed/movie/${currentMediaId}`;
                } else {
                    finalUrl = `https://vidsrc.to/embed/tv/${currentMediaId}/${season}/${episode}`;
                }
            }

            mainIframe.src = finalUrl;
        }

        function switchServer(srvName) {
            currentServer = srvName;
            document.querySelectorAll('.server-btns button').forEach(b => b.classList.remove('active'));
            if (srvName === 'vidlink') document.getElementById('srv1').classList.add('active');
            if (srvName === 'autoembed') document.getElementById('srv2').classList.add('active');
            if (srvName === 'vidsrc') document.getElementById('srv3').classList.add('active');
            renderEmbed();
        }

        function updateEpisode() {
            renderEmbed();
        }

        function closePlayer() {
            playerContainer.style.display = 'none';
            mainIframe.src = '';
        }

        window.onload = fetchTrendingMedia;
    </script>
</body>
</html>
