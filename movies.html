<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الاميري موفيز</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            padding-bottom: 30px;
        }

        /* 1. المشغل العلوي الثابت تماماً مثل مشغل القنوات */
        #player-wrapper {
            position: sticky;
            top: 0;
            width: 100%;
            height: 240px;
            background-color: #000000;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
            border-bottom: 1px solid #1a1a1a;
        }

        @media (min-width: 768px) {
            #player-wrapper {
                height: 480px;
            }
        }

        #main-player {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #000000;
        }

        /* 2. شريط التحكم والسيرفرات وزر TV */
        .controls-bar {
            background-color: #0a0a0a;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #1f1f1f;
            gap: 8px;
        }

        .server-buttons {
            display: flex;
            gap: 6px;
        }

        .btn-server {
            background: #1e1e24;
            color: #aaa;
            border: 1px solid #333;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-server.active {
            background: #e50914;
            color: #fff;
            border-color: #e50914;
        }

        /* زر Tv المميز للرجوع للمباشر */
        .btn-tv {
            background: linear-gradient(135deg, #00c853, #009624);
            color: #ffffff !important;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 200, 83, 0.4);
        }

        .btn-tv:active {
            transform: scale(0.96);
        }

        .now-playing-title {
            color: #e50914;
            font-size: 13px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 40%;
        }

        /* 3. صندوق البحث السريع */
        .search-container {
            padding: 12px 14px 6px 14px;
            display: flex;
            gap: 8px;
        }

        .search-input {
            flex: 1;
            background: #141414;
            border: 1px solid #282828;
            color: #fff;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .search-input:focus {
            border-color: #e50914;
        }

        .search-btn {
            background: #e50914;
            color: white;
            border: none;
            padding: 0 18px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        /* 4. شريط الأقسام الأفقي (مثل المباشر) */
        .categories-scroll {
            display: flex;
            gap: 8px;
            padding: 10px 14px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .categories-scroll::-webkit-scrollbar { display: none; }

        .cat-chip {
            background: #141414;
            color: #b3b3b3;
            border: 1px solid #262626;
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 13px;
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
        }

        .cat-chip.active {
            background: #e50914;
            color: white;
            border-color: #e50914;
            font-weight: bold;
        }

        /* عنوان القسم الحالي */
        .section-header {
            padding: 12px 16px 6px 16px;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-header::before {
            content: "";
            width: 4px;
            height: 16px;
            background: #e50914;
            border-radius: 2px;
        }

        /* 5. شبكة البوسترات والكروت */
        .media-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 10px 14px;
        }

        @media (min-width: 600px) {
            .media-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 14px;
            }
        }
        @media (min-width: 900px) {
            .media-grid {
                grid-template-columns: repeat(6, 1fr);
            }
        }

        .card {
            background: #111;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            transition: transform 0.2s;
            border: 1px solid #1f1f1f;
        }

        .card:active {
            transform: scale(0.96);
        }

        .card img {
            width: 100%;
            aspect-ratio: 2 / 3;
            object-fit: cover;
            display: block;
            background: #181818;
        }

        .card-info {
            padding: 6px;
        }

        .card-title {
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #eee;
        }

        .badge-type {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(0,0,0,0.75);
            color: #ffd700;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }

        /* رسالة التحميل والخطأ */
        .state-box {
            text-align: center;
            padding: 40px 20px;
            color: #888;
            font-size: 14px;
            grid-column: 1 / -1;
        }

        /* محدد المواسم والحلقات للمسلسلات */
        #tv-controls {
            display: none;
            background: #111;
            padding: 8px 14px;
            border-bottom: 1px solid #222;
            gap: 8px;
            align-items: center;
        }
        .tv-select {
            background: #222;
            color: #fff;
            border: 1px solid #333;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <!-- 1. المشغل الثابت فوق -->
    <div id="player-wrapper">
        <iframe id="main-player" 
                src="" 
                allowfullscreen="true" 
                webkitallowfullscreen="true" 
                mozallowfullscreen="true"
                sandbox="allow-scripts allow-same-origin allow-forms allow-presentation">
        </iframe>
    </div>

    <!-- 2. شريط السيرفرات + زر TV -->
    <div class="controls-bar">
        <div class="server-buttons">
            <button class="btn-server active" id="srv1" onclick="switchServer(1)">سيرفر 1</button>
            <button class="btn-server" id="srv2" onclick="switchServer(2)">سيرفر 2</button>
        </div>
        <div class="now-playing-title" id="now-playing">اختر فيلماً للمشاهدة</div>
        <a href="https://alameeereshooot-web.github.io/i/" class="btn-tv" title="الانتقال إلى البث المباشر">
            <i class="fas fa-tv"></i> Tv
        </a>
    </div>

    <!-- محدد الحلقات للمسلسلات -->
    <div id="tv-controls">
        <span style="font-size: 12px; color: #aaa;">الموسم:</span>
        <select id="season-num" class="tv-select" onchange="updateEpisode()"></select>
        <span style="font-size: 12px; color: #aaa; margin-right: 6px;">الحلقة:</span>
        <select id="episode-num" class="tv-select" onchange="updateEpisode()"></select>
    </div>

    <!-- 3. البحث -->
    <div class="search-container">
        <input type="text" id="search-box" class="search-input" placeholder="ابحث عن فيلم أو مسلسل..." onkeypress="handleEnter(event)">
        <button class="search-btn" onclick="searchMedia()"><i class="fas fa-search"></i></button>
    </div>

    <!-- 4. المجموعات والتصنيفات -->
    <div class="categories-scroll">
        <div class="cat-chip active" onclick="loadCat('trending', this)">🔥 الأكثر رواجاً</div>
        <div class="cat-chip" onclick="loadCat('arabic', this)">🇸🇦 أفلام عربية</div>
        <div class="cat-chip" onclick="loadCat('action', this)">💥 أكشن وإثارة</div>
        <div class="cat-chip" onclick="loadCat('series', this)">📺 مسلسلات</div>
        <div class="cat-chip" onclick="loadCat('anime', this)">🎨 أنمي وكارتون</div>
        <div class="cat-chip" onclick="loadCat('comedy', this)">😂 كوميديا</div>
        <div class="cat-chip" onclick="loadCat('horror', this)">👻 رعب</div>
    </div>

    <div class="section-header" id="current-cat-title">الأكثر رواجاً</div>

    <!-- 5. شبكة الأفلام -->
    <div class="media-grid" id="grid">
        <div class="state-box">جاري تحميل البوسترات...</div>
    </div>

    <script>
        const TMDB_KEY = 'c7f20018c3cfa8d9e2621142511eaee4';
        
        // بروكسيات متعددة لضمان تخطي أي حجب لمزودات الاتصال باليمن
        const PROXIES = [
            (u) => `https://l.alameeeretv.workers.dev/?url=${encodeURIComponent(u)}`,
            (u) => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
            (u) => `https://corsproxy.io/?${encodeURIComponent(u)}`
        ];

        let currentServer = 1;
        let currentItem = { id: 533535, type: 'movie', title: 'Deadpool & Wolverine' }; // افتراضي عند الفتح
        let currentSeason = 1;
        let currentEpisode = 1;

        // دالة جلب قوية تتنقل بين البروكسيات تلقائياً في حال فشل أي واحد
        async function fetchAPI(endpoint) {
            const tmdbUrl = `https://api.themoviedb.org/3${endpoint}${endpoint.includes('?') ? '&' : '?'}api_key=${TMDB_KEY}&language=ar-SA`;
            
            // نجرب أولاً رابط Workers الخاص بك ثم البدائل
            for (let proxyFn of PROXIES) {
                try {
                    const target = proxyFn(tmdbUrl);
                    const res = await fetch(target, { cache: "no-store" });
                    if (res.ok) {
                        const data = await res.json();
                        if (data && (data.results || data.id)) return data.results || data;
                    }
                } catch (e) {
                    // الانتقال للبروكسي التالي
                }
            }

            // محاولة أخيرة مباشرة بدون بروكسي
            try {
                const direct = await fetch(tmdbUrl);
                if (direct.ok) {
                    const data = await direct.json();
                    return data.results || data;
                }
            } catch(e) {}

            return [];
        }

        // تشغيل الرابط في المشغل بحسب السيرفر
        function playMedia() {
            const player = document.getElementById('main-player');
            const titleEl = document.getElementById('now-playing');
            titleEl.textContent = currentItem.title || 'جاري العرض';

            let src = '';
            const id = currentItem.id;
            const isTv = currentItem.type === 'tv';

            if (currentServer === 1) {
                // سيرفر 1 (VidLink سريع ونظيف وبترجمة تلقائية)
                src = isTv 
                    ? `https://vidlink.pro/tv/${id}/${currentSeason}/${currentEpisode}?sub.info=true`
                    : `https://vidlink.pro/movie/${id}?sub.info=true`;
            } else {
                // سيرفر 2 (AutoEmbed بديل قوي)
                src = isTv
                    ? `https://player.autoembed.cc/embed/tv/${id}/${currentSeason}/${currentEpisode}`
                    : `https://player.autoembed.cc/embed/movie/${id}`;
            }

            player.src = src;
        }

        function switchServer(num) {
            currentServer = num;
            document.getElementById('srv1').classList.toggle('active', num === 1);
            document.getElementById('srv2').classList.toggle('active', num === 2);
            playMedia();
        }

        function selectMedia(id, type, title, totalSeasons = 1) {
            currentItem = { id, type, title };
            currentSeason = 1;
            currentEpisode = 1;

            const tvCtrl = document.getElementById('tv-controls');
            if (type === 'tv') {
                tvCtrl.style.display = 'flex';
                setupTvDropdowns(totalSeasons || 3);
            } else {
                tvCtrl.style.display = 'none';
            }

            playMedia();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function setupTvDropdowns(seasonsCount) {
            const sSelect = document.getElementById('season-num');
            const eSelect = document.getElementById('episode-num');
            sSelect.innerHTML = '';
            eSelect.innerHTML = '';

            for (let s = 1; s <= (seasonsCount || 1); s++) {
                sSelect.innerHTML += `<option value="${s}">الموسم ${s}</option>`;
            }
            for (let e = 1; e <= 30; e++) {
                eSelect.innerHTML += `<option value="${e}">الحلقة ${e}</option>`;
            }
        }

        function updateEpisode() {
            currentSeason = document.getElementById('season-num').value;
            currentEpisode = document.getElementById('episode-num').value;
            playMedia();
        }

        // رسم البوسترات في الصفحة
        function renderList(items) {
            const grid = document.getElementById('grid');
            if (!items || items.length === 0) {
                grid.innerHTML = '<div class="state-box">تعذر العثور على محتوى حالياً، اضغط تصنيفاً آخر.</div>';
                return;
            }

            grid.innerHTML = items.filter(it => it.poster_path).map(it => {
                const title = it.title || it.name || 'بدون اسم';
                const type = it.media_type || (it.first_air_date ? 'tv' : 'movie');
                const badge = type === 'tv' ? 'مسلسل' : 'فيلم';
                const safeTitle = title.replace(/'/g, "\\'");
                const poster = `https://image.tmdb.org/t/p/w342${it.poster_path}`;

                return `
                    <div class="card" onclick="selectMedia(${it.id}, '${type}', '${safeTitle}')">
                        <span class="badge-type">${badge}</span>
                        <img src="${poster}" alt="${title}" loading="lazy">
                        <div class="card-info">
                            <div class="card-title">${title}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // تحميل الأقسام
        async function loadCat(cat, chipEl) {
            if (chipEl) {
                document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
                chipEl.classList.add('active');
                document.getElementById('current-cat-title').textContent = chipEl.textContent.replace(/^[^\s]+ /, '');
            }

            const grid = document.getElementById('grid');
            grid.innerHTML = '<div class="state-box">جاري جلب البوسترات...</div>';

            let endpoint = '/trending/all/day';
            if (cat === 'arabic') endpoint = '/discover/movie?with_original_language=ar&sort_by=popularity.desc';
            if (cat === 'action') endpoint = '/discover/movie?with_genres=28&sort_by=popularity.desc';
            if (cat === 'series') endpoint = '/discover/tv?sort_by=popularity.desc';
            if (cat === 'anime') endpoint = '/discover/tv?with_genres=16&sort_by=popularity.desc';
            if (cat === 'comedy') endpoint = '/discover/movie?with_genres=35&sort_by=popularity.desc';
            if (cat === 'horror') endpoint = '/discover/movie?with_genres=27&sort_by=popularity.desc';

            const items = await fetchAPI(endpoint);
            renderList(items);
        }

        async function searchMedia() {
            const query = document.getElementById('search-box').value.trim();
            if (!query) return;

            document.getElementById('current-cat-title').textContent = `نتائج البحث عن: "${query}"`;
            const grid = document.getElementById('grid');
            grid.innerHTML = '<div class="state-box">جاري البحث...</div>';

            const items = await fetchAPI(`/search/multi?query=${encodeURIComponent(query)}`);
            renderList(items);
        }

        function handleEnter(e) {
            if (e.key === 'Enter') searchMedia();
        }

        // بدء التشغيل
        window.onload = () => {
            playMedia(); // يبدأ المشغل شغال مباشرة فوق
            loadCat('trending', null);
        };
    </script>
</body>
</html>
