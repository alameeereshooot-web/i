<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الاميري موفيز | Alameeer Movies</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Cairo', sans-serif;
            overflow-x: hidden;
            padding-bottom: 50px;
        }

        /* 1. المشغل الثابت في أعلى الصفحة */
        #player-wrapper {
            position: sticky;
            top: 0;
            width: 100%;
            background: #000000;
            z-index: 1000;
            border-bottom: 2px solid #1c1c24;
            display: none;
        }
        .player-container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background: #000;
        }
        .player-container iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: none;
        }
        .player-bar {
            max-width: 900px;
            margin: 0 auto;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0a0a0f;
            gap: 8px;
            flex-wrap: wrap;
        }
        .media-title {
            font-size: 13px;
            font-weight: 700;
            color: #e50914;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 50%;
        }
        .server-pills {
            display: flex;
            gap: 6px;
        }
        .server-btn {
            background: #1f1f2e;
            color: #fff;
            border: 1px solid #333;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            font-family: inherit;
        }
        .server-btn.active {
            background: #e50914;
            border-color: #e50914;
        }
        .close-btn {
            background: #333;
            color: #fff;
            border: none;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }

        /* التحكم بالحلقات للمسلسلات */
        .ep-controls {
            display: none;
            align-items: center;
            gap: 6px;
            font-size: 11px;
        }
        .ep-controls input {
            width: 45px;
            background: #181824;
            border: 1px solid #333;
            color: #fff;
            padding: 2px 4px;
            border-radius: 4px;
            text-align: center;
            font-size: 11px;
        }

        /* 2. شريط البحث والتصنيفات في الأعلى */
        .header {
            padding: 12px 14px;
            display: flex;
            gap: 8px;
            align-items: center;
            background: #000;
        }
        .search-box {
            flex: 1;
            position: relative;
        }
        .search-box input {
            width: 100%;
            background: #121218;
            border: 1px solid #252530;
            padding: 8px 14px;
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
            outline: none;
            font-family: inherit;
        }
        .search-box input:focus {
            border-color: #e50914;
        }
        .search-btn {
            background: #e50914;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
        }

        /* شريط التصنيفات الأفقي (مثل قنوات المباشر) */
        .categories-nav {
            display: flex;
            gap: 8px;
            padding: 8px 14px 14px 14px;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
            background: #000;
        }
        .categories-nav::-webkit-scrollbar { display: none; }
        .cat-chip {
            background: #121218;
            border: 1px solid #222;
            color: #bbb;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .cat-chip.active {
            background: #e50914;
            color: #fff;
            border-color: #e50914;
        }

        /* 3. شبكة الأفلام (الكروت) */
        .section-title {
            padding: 10px 14px 6px 14px;
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .section-title::before {
            content: '';
            width: 4px;
            height: 14px;
            background: #e50914;
            border-radius: 2px;
        }
        .movies-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 10px 14px;
        }
        @media (min-width: 600px) {
            .movies-grid { grid-template-columns: repeat(4, 1fr); }
        }
        @media (min-width: 900px) {
            .movies-grid { grid-template-columns: repeat(6, 1fr); }
        }

        .movie-card {
            background: #0d0d12;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: transform 0.2s;
            border: 1px solid #1a1a24;
        }
        .movie-card:hover { transform: translateY(-4px); }
        .poster-box {
            position: relative;
            padding-top: 148%;
            background: #151520;
        }
        .poster-box img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
        }
        .rating-badge {
            position: absolute;
            top: 6px; left: 6px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 700;
            color: #ffb703;
        }
        .type-badge {
            position: absolute;
            top: 6px; right: 6px;
            background: #e50914;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 9px;
            font-weight: 700;
        }
        .card-info {
            padding: 6px 8px;
        }
        .card-name {
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #eee;
        }
        .card-year {
            font-size: 10px;
            color: #777;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <!-- المشغل الثابت في الأعلى -->
    <div id="player-wrapper">
        <div class="player-container">
            <iframe id="video-frame" allowfullscreen sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
        </div>
        <div class="player-bar">
            <span class="media-title" id="p-title">جاري التحميل...</span>
            <div class="ep-controls" id="ep-controls">
                <span>موسم:</span>
                <input type="number" id="season-num" value="1" min="1" onchange="updateEpisode()">
                <span>حلقة:</span>
                <input type="number" id="ep-num" value="1" min="1" onchange="updateEpisode()">
            </div>
            <div class="server-pills">
                <button class="server-btn active" onclick="switchServer(1)">سيرفر 1 (عربي)</button>
                <button class="server-btn" onclick="switchServer(2)">سيرفر 2</button>
            </div>
            <button class="close-btn" onclick="closePlayer()">✕ إغلاق</button>
        </div>
    </div>

    <!-- شريط البحث -->
    <div class="header">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ابحث عن فيلم أو مسلسل..." onkeypress="handleEnter(event)">
        </div>
        <button class="search-btn" onclick="searchMedia()">بحث</button>
    </div>

    <!-- شريط المجموعات والتصنيفات -->
    <div class="categories-nav">
        <button class="cat-chip active" onclick="loadCategory('trending', this)">🔥 الأكثر رواجاً</button>
        <button class="cat-chip" onclick="loadCategory('arabic', this)">🇸🇦 أفلام عربية</button>
        <button class="cat-chip" onclick="loadCategory('action', this)">💥 أكشن وإثارة</button>
        <button class="cat-chip" onclick="loadCategory('series', this)">📺 مسلسلات</button>
        <button class="cat-chip" onclick="loadCategory('comedy', this)">😂 كوميديا</button>
        <button class="cat-chip" onclick="loadCategory('horror', this)">👻 رعب</button>
        <button class="cat-chip" onclick="loadCategory('animation', this)">🎨 أنمي وكارتون</button>
    </div>

    <!-- العنوان وشبكة العرض -->
    <div class="section-title" id="sec-title">الأكثر رواجاً هذا الأسبوع</div>
    <div class="movies-grid" id="grid"></div>

    <script>
        const API_KEY = 'c7f20018c3cfd619983fa996c5aa527b';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t/p/w342';

        let currentId = null;
        let currentType = 'movie';
        let currentServer = 1;

        // 1. تشغيل الفيديو في المشغل الثابت
        function playMedia(id, type, title) {
            currentId = id;
            currentType = type;
            document.getElementById('p-title').innerText = title;

            const isTv = (type === 'tv');
            document.getElementById('ep-controls').style.display = isTv ? 'flex' : 'none';

            updateFrameSource();
            document.getElementById('player-wrapper').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function updateFrameSource() {
            const season = document.getElementById('season-num').value || 1;
            const episode = document.getElementById('ep-num').value || 1;
            const frame = document.getElementById('video-frame');

            if (currentServer === 1) {
                // سيرفر VidLink النظيف مع فرض الترجمة العربية
                if (currentType === 'tv') {
                    frame.src = `https://vidlink.pro/tv/${currentId}/${season}/${episode}?sub.info=true&sub.lang=ar`;
                } else {
                    frame.src = `https://vidlink.pro/movie/${currentId}?sub.info=true&sub.lang=ar`;
                }
            } else {
                // سيرفر بديل
                if (currentType === 'tv') {
                    frame.src = `https://autoembed.co/tv/tmdb/${currentId}-${season}-${episode}`;
                } else {
                    frame.src = `https://autoembed.co/movie/tmdb/${currentId}`;
                }
            }
        }

        function switchServer(num) {
            currentServer = num;
            document.querySelectorAll('.server-btn').forEach((b, idx) => {
                b.classList.toggle('active', idx + 1 === num);
            });
            updateFrameSource();
        }

        function updateEpisode() {
            updateFrameSource();
        }

        function closePlayer() {
            document.getElementById('player-wrapper').style.display = 'none';
            document.getElementById('video-frame').src = '';
        }

        // 2. جلب وتصنيف الأفلام من API
        async function fetchAPI(endpoint) {
            try {
                const res = await fetch(`${BASE_URL}${endpoint}${endpoint.includes('?') ? '&' : '?'}api_key=${API_KEY}&language=ar-SA`);
                const data = await res.json();
                return data.results || [];
            } catch (e) {
                console.error("فشل الجلب:", e);
                return [];
            }
        }

        async function renderList(items, typeDefault = 'movie') {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            if (!items || items.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #666; padding: 40px;">لا توجد نتائج حالياً</p>';
                return;
            }

            items.forEach(item => {
                const title = item.title || item.name;
                const date = item.release_date || item.first_air_date || '';
                const year = date ? date.split('-')[0] : '';
                const type = item.media_type || typeDefault;
                const poster = item.poster_path ? `${IMG_URL}${item.poster_path}` : 'https://via.placeholder.com/300x450/111/444?text=No+Poster';
                const rating = item.vote_average ? item.vote_average.toFixed(1) : '5.0';

                const card = document.createElement('div');
                card.className = 'movie-card';
                card.onclick = () => playMedia(item.id, type, title);
                card.innerHTML = `
                    <div class="poster-box">
                        <img src="${poster}" alt="${title}" loading="lazy">
                        <span class="rating-badge">★ ${rating}</span>
                        <span class="type-badge">${type === 'tv' ? 'مسلسل' : 'فيلم'}</span>
                    </div>
                    <div class="card-info">
                        <div class="card-name">${title}</div>
                        <div class="card-year">${year}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        async function loadCategory(cat, el) {
            document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
            if (el) el.classList.add('active');

            const titleEl = document.getElementById('sec-title');

            if (cat === 'trending') {
                titleEl.innerText = '🔥 الأكثر رواجاً هذا الأسبوع';
                const data = await fetchAPI('/trending/all/week');
                renderList(data);
            } else if (cat === 'arabic') {
                titleEl.innerText = '🇸🇦 أفلام عربية ومصرية';
                const data = await fetchAPI('/discover/movie?with_original_language=ar&sort_by=popularity.desc');
                renderList(data, 'movie');
            } else if (cat === 'action') {
                titleEl.innerText = '💥 أقوى أفلام الأكشن';
                const data = await fetchAPI('/discover/movie?with_genres=28&sort_by=popularity.desc');
                renderList(data, 'movie');
            } else if (cat === 'series') {
                titleEl.innerText = '📺 مسلسلات رائجة';
                const data = await fetchAPI('/trending/tv/week');
                renderList(data, 'tv');
            } else if (cat === 'comedy') {
                titleEl.innerText = '😂 أفلام كوميدية';
                const data = await fetchAPI('/discover/movie?with_genres=35&sort_by=popularity.desc');
                renderList(data, 'movie');
            } else if (cat === 'horror') {
                titleEl.innerText = '👻 أفلام رعب';
                const data = await fetchAPI('/discover/movie?with_genres=27&sort_by=popularity.desc');
                renderList(data, 'movie');
            } else if (cat === 'animation') {
                titleEl.innerText = '🎨 أنمي ورسوم متحركة';
                const data = await fetchAPI('/discover/movie?with_genres=16&sort_by=popularity.desc');
                renderList(data, 'movie');
            }
        }

        async function searchMedia() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;
            document.getElementById('sec-title').innerText = `نتائج البحث عن: ${query}`;
            const data = await fetchAPI(`/search/multi?query=${encodeURIComponent(query)}`);
            renderList(data);
        }

        function handleEnter(e) {
            if (e.key === 'Enter') searchMedia();
        }

        // تشغيل الرائج عند فتح الصفحة تلقائياً
        window.onload = () => loadCategory('trending');
    </script>
</body>
</html>
